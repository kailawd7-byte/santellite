<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="satGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>
  
  <!-- Rounded squircle container with space gradient -->
  <rect width="64" height="64" rx="15" fill="url(#satGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="white" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Orbit & Satellite Icon (Lucide Orbit transformed & centered) -->
  <g transform="translate(10, 10) scale(1.8333)" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Orbital Arcs -->
    <path d="M20.341 6.484A10 10 0 0 1 10.266 21.85" />
    <path d="M3.659 17.516A10 10 0 0 1 13.74 2.152" />
    
    <!-- Central Body / Planet -->
    <circle cx="12" cy="12" r="3.2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5" />
    
    <!-- Orbiting Satellites -->
    <circle cx="19" cy="5" r="2.2" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="5" cy="19" r="2.2" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.2" />
  </g>
</svg>
